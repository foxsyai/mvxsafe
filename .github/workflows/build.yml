# The only workflow this project needs: is it clean, does it typecheck, do the
# tests pass and does it build?
#
# The template we forked shipped deploy-mainnet, deploy-devnet, deploy-testnet,
# deploy-next, deploy-integration and two e2e workflows, all aimed at
# MultiversX's own infrastructure. They failed on every push here, by design,
# because the secrets and the target are theirs. Deployment of this site is
# ./deploy.sh to our own droplet.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # src/config/index.ts is generated per network and is not in git, so it
      # has to exist before anything typechecks.
      - name: Choose the network config
        run: pnpm copy-mainnet-config
      # main was made lint-clean on 15 Oct 2026; this keeps it so.
      - name: Lint and format
        run: |
          npx eslint src --max-warnings 0
          npx prettier --check src
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx jest --silent
      - name: Build
        run: npx vite build
