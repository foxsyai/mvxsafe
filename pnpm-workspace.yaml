allowBuilds:
  '@swc/core': false
  esbuild: false
  keccak: false
  protobufjs: false
  unrs-resolver: false
# A version must be a day old before it can be installed: most malicious
# releases are caught and pulled within hours. No exclusions, the MultiversX
# packages least of all, since they are the ones that sign.
minimumReleaseAge: 1440
# Patched versions of transitive packages with known advisories (ops audit
# OPS-07, 7 Oct 2026). Most are Node-side denial-of-service bugs that never run
# in the browser bundle, but they cost nothing to close. braces has no fixed
# release yet (3.0.3 is the latest); it is glob tooling and never ships.
overrides:
  socket.io-parser@>=4.0.0 <4.2.7: 4.2.7
  nanoid@<3.3.18: 3.3.20
  brace-expansion@>=4.0.0 <5.0.11: 5.0.12
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  '@vue/server-renderer@<3.5.42': 3.5.43
  # 8 Oct 2026: qs (denial of service in the cross-window wallet provider),
  # pbkdf2 (denial of service in bip39, which the app never calls) and postcss
  # (build-time file read through a sourceMappingURL). None reachable here.
  qs@<6.16.0: 6.16.0
  pbkdf2@<3.1.7: 3.1.7
  postcss@<8.5.23: 8.5.28
  # 21 Oct 2026: follow-redirects (credential headers kept across a redirect),
  # through axios. Node-side, not in the browser bundle (ops audit OPX-05).
  follow-redirects@>=1.16.0 <1.16.1: 1.16.1
# `pnpm audit --prod --audit-level=high` gates CI and deploy.sh (OPX-05). What
# it may pass over, each with no fixed release and no way into the bundle:
# braces, reached only through @types/jest in sdk-dapp's dependencies.
# uuid 8.3.2 (moderate, fixed in 11): the bounds check missing from v3(), v5()
# and v6() when they are given a buffer. sdk-core, its only user here, calls
# v4() alone, in keystore code the app never runs; moving the signing
# library's uuid two major versions is not worth that (checked 21 Oct 2026).
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-w5hq-g745-h8pq
