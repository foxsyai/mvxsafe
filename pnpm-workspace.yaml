allowBuilds:
  '@swc/core': false
  esbuild: false
  keccak: false
  protobufjs: false
  unrs-resolver: false
# A version must be a day old before it can be installed: most malicious
# releases are caught and pulled within hours. No exclusions, the MultiversX
# packages least of all, since they are the ones that sign.
minimumReleaseAge: 1440
# Patched versions of transitive packages with known advisories (ops audit
# OPS-07, 7 Oct 2026). Most are Node-side denial-of-service bugs that never run
# in the browser bundle, but they cost nothing to close. braces has no fixed
# release yet (3.0.3 is the latest); it is glob tooling and never ships.
overrides:
  socket.io-parser@>=4.0.0 <4.2.7: 4.2.7
  nanoid@<3.3.18: 3.3.20
  brace-expansion@>=4.0.0 <5.0.11: 5.0.12
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  '@vue/server-renderer@<3.5.42': 3.5.43
