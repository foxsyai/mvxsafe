<!-- The favicon adapts to the browser theme: a white check vanishes on Chrome's
     light tab strip and a dark one vanishes on its dark strip, so the check
     follows prefers-color-scheme. The orange head is readable on both. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <style>
    .check { stroke: #09090D; }
    @media (prefers-color-scheme: dark) { .check { stroke: #F5F5F5; } }
  </style>
  <path d="M 84 24 L 180 160 L 332 160 L 428 24 L 472 300 L 256 492 L 40 300 Z"
        stroke="#FF6E0A" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="check" d="M 178 296 L 232 350 L 334 244"
        stroke-width="32" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
